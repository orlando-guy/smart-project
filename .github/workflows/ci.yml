name: SmartProject Monorepo

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    test_and_build:
        name: Test and Build
        runs-on: ubuntu-latest
        env:
            CI: true
            NODE_ENV: test
            JWT_SECRET: "a-very-long-secret-for-testing-purposes-only-32-chars"
            DATABASE_URL: "file:./dev.db"
            API_PORT: "4000"

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: "11.0.9"

            - name: Setup pnpm cache
              uses: actions/cache@v4
              with:
                  path: |
                    ~/.pnpm-store
                    ${{ github.workspace }}/.turbo
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Prisma Client
              run: pnpm run generate

            - name: Push Database Schema
              run: pnpm --filter @repo/database exec prisma db push --accept-data-loss

            - name: Run Tests (Turborepo)
              run: pnpm run test

            - name: Build Projects (Turborepo)
              run: pnpm run build
